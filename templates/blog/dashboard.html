{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h1>My Dashboard</h1><a class="btn btn-dark" href="{% url 'post_create' %}">+ New Post</a></div>{% for p in posts %}<div class="card mb-2"><div class="card-body d-flex justify-content-between"><div><h5>{{p.title}}</h5><span class="badge text-bg-secondary">{{p.status}}</span> · {{p.views}} views</div><div>{% if p.status == "published" %}<a class="btn btn-sm btn-outline-dark" href="{{p.get_absolute_url}}">View</a>{% endif %}<a class="btn btn-sm btn-outline-primary" href="{% url 'post_edit' p.slug %}">Edit</a><a class="btn btn-sm btn-outline-danger" href="{% url 'post_delete' p.slug %}">Delete</a></div></div></div>{% empty %}<p>No posts yet.</p>{% endfor %}{% endblock %}
