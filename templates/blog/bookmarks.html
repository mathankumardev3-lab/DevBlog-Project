{% extends "base.html" %}{% block content %}<h1>Bookmarks</h1>{% for post in posts %}<div class="card mb-3"><div class="card-body"><h4><a href="{{post.get_absolute_url}}">{{post.title}}</a></h4><p>{{post.excerpt|truncatechars:160}}</p></div></div>{% empty %}<p>No bookmarks yet.</p>{% endfor %}{% endblock %}
